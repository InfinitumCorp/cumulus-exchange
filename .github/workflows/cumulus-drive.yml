name: cumulus-drive

on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cumulus-drive.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cumulus-drive.yml"

permissions:
  contents: read

jobs:
  test:
    name: drive tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install Drive dependencies
        working-directory: cloud
        run: npm ci
      - name: Reject GPL, AGPL, and MinIO
        working-directory: cloud
        run: npm run licenses
      - name: Start local Postgres and SeaweedFS
        run: docker compose -f cloud/deploy/docker-compose.yml up -d
      - name: Test
        working-directory: cloud
        run: npm test
