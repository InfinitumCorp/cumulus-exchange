name: console

on:
  push:
    paths-ignore:
      - "cloud/**"
  pull_request:
    paths-ignore:
      - "cloud/**"

permissions:
  contents: read

jobs:
  console:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
