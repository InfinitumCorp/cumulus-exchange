name: console

on:
  push:
    paths-ignore:
      - "cloud/**"
  pull_request:
    paths-ignore:
      - "cloud/**"

permissions:
  contents: read

jobs:
  console:
    name: lint, typecheck, test, build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Build the cumulus-cloud Worker (Cloudflare) and validate the upload
        run: |
          NITRO_PRESET=cloudflare-module npx vite build
          npx --yes wrangler@4.161.0 deploy --dry-run --config cloud/worker/wrangler.toml --outdir "$RUNNER_TEMP/worker-dry-run"
